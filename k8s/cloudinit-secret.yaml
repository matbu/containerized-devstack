# cloud-init for the containerized-devstack KubeVirt VM.
# Kept in a Secret (not inline on the VM) because inline cloudInitNoCloud userData
# is capped at 2048 bytes — too small once you add an SSH key.
#
# To get SSH access, add your public key under ssh_authorized_keys below, then:
#   oc apply -f k8s/cloudinit-secret.yaml
#   oc apply -f k8s/virtualmachine.yaml
apiVersion: v1
kind: Secret
metadata:
  name: containerized-devstack-cloudinit
stringData:
  userdata: |-
    #cloud-config
    user: cloud-user
    # Set a real password at apply-time if you need console/password login;
    # access is normally via your injected SSH key. Do NOT commit a real
    # password to this public repo.
    password: 'CHANGEME'
    chpasswd: { expire: False }
    ssh_pwauth: True
    ssh_authorized_keys:
    write_files:
      - path: /root/deploy-devstack.sh
        permissions: '0755'
        content: |
          #!/bin/bash
          # Bootstrap containerized-devstack inside this VM (local mode).
          # Use the CentOS Stream 9 image: this OCP/KubeVirt network can't reach
          # Ubuntu's apt mirrors, so the ubuntu-based :latest image can't stack.
          set -eux
          IMAGE=quay.io/os-migrate/devstack:centos9-2025.1
          CONTAINER=devstack
          DATA=/home/containerized-devstack-data
          NET=devstack-net
          IP=172.31.0.10
          for m in kvm kvm_intel kvm_amd openvswitch geneve vhost_net nf_conntrack tun; do
              modprobe "$m" 2>/dev/null || true
          done
          # The guest OS dnf (like the container's) must prefer fast/reachable
          # mirrors — on restricted networks the default mirrorlist crawls at
          # ~1kB/s on dead community mirrors. (The container image already bakes
          # this; the guest needs it too, before installing podman.)
          for kv in fastestmirror=True max_parallel_downloads=10 timeout=10 retries=10 minrate=100 ip_resolve=4; do
              grep -q "^${kv%%=*}=" /etc/dnf/dnf.conf || echo "$kv" >> /etc/dnf/dnf.conf
          done
          dnf -y install podman || yum -y install podman
          mkdir -p "$DATA"; chmod 0777 "$DATA"
          podman network exists "$NET" || \
              podman network create --subnet 172.31.0.0/24 --gateway 172.31.0.1 "$NET"
          podman pull "$IMAGE"
          podman rm -f "$CONTAINER" 2>/dev/null || true
          podman run -d --name "$CONTAINER" \
              --privileged --systemd=always --hostname "$CONTAINER" \
              --network "$NET" --ip "$IP" \
              --device /dev/kvm \
              -v "$DATA":/opt/stack/data \
              "$IMAGE"
          for i in $(seq 1 60); do
              podman exec "$CONTAINER" systemctl is-system-running 2>/dev/null \
                  | grep -qE 'running|degraded' && break
              sleep 2
          done
          # Route OpenStack floating IPs (they live inside the container's netns)
          # so the VM — and anything hopping through it (CI, ssh ProxyJump) — can
          # reach instances like the conversion host at 172.40.0.x.
          ip route replace 172.40.0.0/24 via "$IP"
          podman exec \
              -e ADMIN_PASSWORD=secretadmin \
              -e CONTAINER_IP="$IP" \
              -e FIXED_RANGE=10.11.0.0/24 \
              -e FLOATING_RANGE=172.40.0.0/24 \
              -e FLOATING_GW=172.40.0.1 \
              -e FLOATING_POOL_START=172.40.0.100 \
              -e FLOATING_POOL_END=172.40.0.200 \
              -e HORIZON_PORT=80 \
              "$CONTAINER" /usr/local/bin/container-stack.sh
          echo "=== containerized-devstack bootstrap finished ==="
    runcmd:
      - [ bash, -c, "nohup /root/deploy-devstack.sh > /var/log/devstack-deploy.log 2>&1 &" ]
